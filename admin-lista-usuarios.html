<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gas El Volcán | Lista de Usuarios</title>
        <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico" />
        
        <!-- Fuentes de Google -->
        
        <!-- Hojas de estilos principales -->
        <link rel="stylesheet" href="assets/css/admin-layout.css" />
        <link rel="stylesheet" href="assets/css/utils/admin-tablas.css" />
        <link rel="stylesheet" href="assets/css/pages/admin-lista-usuarios.css" />
    </head>
    <body>
        <!-- Control del menú móvil -->
        <input type="checkbox" id="toggle-menu" class="toggle-menu-checkbox">

        <!-- Cabecera principal -->
        <header class="admin-cabecera">
            <div class="cabecera-izq">
                <label for="toggle-menu" class="btn-hamburguesa">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </label>
                <a href="admin-index.html" class="logo-admin">
                    <img src="assets/images/favicon.ico" alt="Icono Gas El Volcán">
                    <span>Admin Volcán</span>
                </a>
            </div>
            <div class="cabecera-der">
                <span class="saludo-admin">Hola, <strong>Administradora</strong></span>
                <a href="login.html" class="btn-salir">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg> 
                    Salir
                </a>
            </div>
        </header>

        <!-- Barra de navegación lateral -->
        <aside class="admin-sidebar">
            <nav class="nav-lateral">
                <ul>
                    <li><a href="admin-index.html">Inicio</a></li>
                    
                    <li class="separador">Módulo Productos</li>
                    <li><a href="admin-lista-productos.html">Listar productos</a></li>
                    <li><a href="admin-nuevo-producto.html">Nuevo producto</a></li>
                    
                    <li class="separador">Módulo Usuarios</li>
                    <li><a href="admin-lista-usuarios.html" class="activo">Listar usuarios</a></li>
                    <li><a href="admin-nuevo-usuario.html">Nuevo usuario</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Contenido dinámico principal -->
        <main class="admin-main">
            <div class="contenedor-vista">
                
                <!-- Cabecera del módulo -->
                <div class="cabecera-modulo">
                    <h1>Lista de Usuarios</h1>
                    <a href="admin-nuevo-usuario.html" class="btn-nuevo-registro">NUEVO USUARIO</a>
                </div>

                <!-- Contenedor de la tabla de datos -->
                <section class="caja-tabla-admin">
                    <div class="tabla-responsiva">
                        <table class="tabla-datos">
                            <thead>
                                <tr>
                                    <th>RUT</th>
                                    <th>Nombre Completo</th>
                                    <th>Email</th>
                                    <th>Teléfono</th>
                                    <th>Región</th>
                                    <th>Comuna</th>
                                    <th>Calle y Número</th>
                                    <th>Rol</th>
                                    <th class="columna-centro">Acciones</th>
                                </tr>
                            </thead>
                            
                            <!-- Inyección dinámica de usuarios -->
                            <tbody id="tbody-usuarios-admin">
                            </tbody>
                        </table>
                    </div>
                </section>
                
            </div>
        </main>

        <!-- Datos maestros y motor de renderizado para las tablas de administración -->
        <script defer src="assets/js/data/productosData.js"></script>
        <script defer src="assets/js/data/usuariosData.js"></script>
        <script defer src="assets/js/services/almacenamiento-local.js"></script>
        <script defer src="assets/js/utils/validaciones.js"></script>
        <script defer src="assets/js/admin/admin-tablas.js"></script>
    </body>
</html>
