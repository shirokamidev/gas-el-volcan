<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gas El Volcán | Lista de Productos</title>
        <link rel="icon" type="image/svg+xml" href="assets/img/favicon-volcan.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="assets/css/admin-layout.css" />
        <link rel="stylesheet" href="assets/css/admin-lista-productos.css" />
    </head>
    <body>
        <!-- Control oculto para el menu hamburguesa responsivo -->
        <input type="checkbox" id="toggle-menu" class="toggle-menu-checkbox">

        <header class="admin-cabecera">
            <div class="cabecera-izq">
                <label for="toggle-menu" class="btn-hamburguesa">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </label>
                <div class="logo-admin">
                    <img src="assets/img/favicon-volcan.svg" alt="Icono Gas El Volcán">
                    <span>Admin Volcán</span>
                </div>
            </div>
            <div class="cabecera-der">
                <span class="saludo-admin">Hola, <strong>Administradora</strong></span>
                <a href="login.html" class="btn-salir">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg> Salir
                </a>
            </div>
        </header>

        <aside class="admin-sidebar">
            <nav class="nav-lateral">
                <ul>
                    <li><a href="admin-index.html">Inicio</a></li>
                    <li class="separador">Módulo Productos</li>
                    <li><a href="admin-lista-productos.html" class="activo">Listar productos</a></li>
                    <li><a href="admin-nuevo-producto.html">Nuevo producto</a></li>
                    <li class="separador">Módulo Usuarios</li>
                    <li><a href="admin-lista-usuarios.html">Listar usuarios</a></li>
                    <li><a href="admin-nuevo-usuario.html">Nuevo usuario</a></li>
                </ul>
            </nav>
        </aside>

        <main class="admin-main">
            <div class="contenedor-vista">
                <div class="cabecera-modulo">
                    <h1>Lista de Productos</h1>
                    <a href="admin-nuevo-producto.html" class="btn-nuevo-registro">NUEVO PRODUCTO</a>
                </div>

                <section class="caja-tabla-admin">
                    <div class="tabla-responsiva">
                        <table class="tabla-datos">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Categoría</th>
                                    <th>Producto</th>
                                    <th>Descripción</th>
                                    <th>Unidad</th>
                                    <th>P. Residencial</th>
                                    <th>P. Comercial</th>
                                    <th>Stock</th>
                                    <th class="columna-centro">Acciones</th>
                                </tr>
                            </thead>
                            <!-- Aquí se inyectarán los productos desde admin.js -->
                            <tbody id="tbody-productos-admin">
                            </tbody>
                        </table>
                    </div>

                    <!-- Paginacion de la tabla con IDs para JS -->
                    <div class="paginacion-admin">
                        <button type="button" id="btn-pag-ant" class="btn-pagina flecha" disabled>&laquo;</button>
                        <button type="button" id="btn-pag-1" class="btn-pagina activo">1</button>
                        <button type="button" id="btn-pag-2" class="btn-pagina">2</button>
                        <button type="button" id="btn-pag-sig" class="btn-pagina flecha">&raquo;</button>
                    </div>
                </section>
            </div>
        </main>

        <!-- Scripts -->
        <script src="assets/js/main.js"></script>
        <script src="assets/js/admin.js"></script>
    </body>
</html>
